<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Local Observability Lab architecture</title>
  <desc id="desc">Orders flow from generated traffic through the API, PostgreSQL outbox, Kafka, dispatcher, RabbitMQ, and fulfillment worker. Kafka also feeds independent analytics. Application telemetry goes through the OpenTelemetry Collector to Prometheus, Loki, and Tempo. Prometheus scrapes infrastructure. Grafana queries those data sources and read-only PostgreSQL.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}
      .title{font-size:32px;font-weight:700}.subtitle{font-size:15px;fill:#526078}.lane{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#526078}
      .nodeTitle{font-size:17px;font-weight:650}.nodeSub{font-size:13px;fill:#526078}.note{font-size:13px;fill:#334155}
      .edge{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.signal{stroke:#2563eb;stroke-width:2.5;fill:none;marker-end:url(#blueArrow)}
      .node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.business{stroke:#b6c9ee}.db{fill:#eef6ff}.queue{fill:#f6f2ff}.stream{fill:#fff7e8}.obs{fill:#eff6ff}.ui{fill:#f4f4f5}
    </style>
  </defs>
  <rect width="1440" height="920" fill="#f8fafc"/>
  <text x="64" y="62" class="title">Local Observability Lab</text>
  <text x="64" y="91" class="subtitle">Order processing and the signals used to observe it</text>
  <rect x="44" y="120" width="1352" height="430" rx="18" fill="#fff" stroke="#e2e8f0"/>
  <text x="72" y="157" class="lane">ORDER PROCESSING</text>
  <path class="edge" d="M210 250H258"/><path class="edge" d="M414 250H462"/><path class="edge" d="M638 250H688"/><path class="edge" d="M858 250H908"/><path class="edge" d="M1070 250H1120"/>
  <rect class="node business" x="72" y="210" width="138" height="80" rx="12"/><text x="141" y="245" text-anchor="middle" class="nodeTitle">Traffic</text><text x="141" y="268" text-anchor="middle" class="nodeSub">generated requests</text>
  <rect class="node business" x="258" y="210" width="156" height="80" rx="12"/><text x="336" y="245" text-anchor="middle" class="nodeTitle">Order API</text><text x="336" y="268" text-anchor="middle" class="nodeSub">accepts order</text>
  <rect class="node db" x="462" y="210" width="176" height="80" rx="12"/><text x="550" y="243" text-anchor="middle" class="nodeTitle">PostgreSQL</text><text x="550" y="267" text-anchor="middle" class="nodeSub">orders + outbox</text>
  <rect class="node business" x="688" y="210" width="170" height="80" rx="12"/><text x="773" y="243" text-anchor="middle" class="nodeTitle">Outbox publisher</text><text x="773" y="267" text-anchor="middle" class="nodeSub">publishes order event</text>
  <rect class="node stream" x="908" y="210" width="162" height="80" rx="12"/><text x="989" y="243" text-anchor="middle" class="nodeTitle">Kafka</text><text x="989" y="267" text-anchor="middle" class="nodeSub">orders.placed</text>
  <rect class="node business" x="1120" y="210" width="162" height="80" rx="12"/><text x="1201" y="243" text-anchor="middle" class="nodeTitle">Dispatcher</text><text x="1201" y="267" text-anchor="middle" class="nodeSub">waits for broker confirm</text>
  <path class="edge" d="M989 290V347H989V365"/><path class="edge" d="M1201 290V365"/><path class="edge" d="M1201 445V475"/>
  <rect class="node business" x="908" y="365" width="162" height="80" rx="12"/><text x="989" y="398" text-anchor="middle" class="nodeTitle">Analytics</text><text x="989" y="422" text-anchor="middle" class="nodeSub">independent Kafka consumer</text>
  <rect class="node queue" x="1120" y="365" width="162" height="80" rx="12"/><text x="1201" y="398" text-anchor="middle" class="nodeTitle">RabbitMQ</text><text x="1201" y="422" text-anchor="middle" class="nodeSub">fulfillment tasks</text>
  <rect class="node business" x="1120" y="475" width="180" height="56" rx="12"/><text x="1210" y="509" text-anchor="middle" class="nodeTitle">Fulfillment worker</text>
  <path class="edge" d="M1120 503H1090V525H550V290"/>
  <text x="820" y="519" text-anchor="middle" class="nodeSub">updates order status</text>
  <text x="72" y="510" class="note">Order + outbox commit together. Stable event IDs and processed_events make fulfillment duplicate safe.</text>

  <rect x="44" y="575" width="1352" height="285" rx="18" fill="#fff" stroke="#e2e8f0"/>
  <text x="72" y="612" class="lane">OBSERVABILITY</text>
  <path class="signal" d="M300 710H360"/><path class="signal" d="M540 710H605"/>
  <path class="signal" d="M790 690H850V655H900"/><path class="signal" d="M790 710H900"/><path class="signal" d="M790 730H850V765H900"/>
  <path class="signal" d="M1070 655H1140V710"/><path class="signal" d="M1070 710H1140"/><path class="signal" d="M1070 765H1140V710"/>
  <rect class="node business" x="92" y="670" width="208" height="80" rx="12"/><text x="196" y="702" text-anchor="middle" class="nodeTitle">Application services</text><text x="196" y="726" text-anchor="middle" class="nodeSub">OTLP traces, logs, metrics</text>
  <rect class="node obs" x="360" y="670" width="180" height="80" rx="12"/><text x="450" y="702" text-anchor="middle" class="nodeTitle">OTel Collector</text><text x="450" y="726" text-anchor="middle" class="nodeSub">receives and routes OTLP</text>
  <rect class="node obs" x="605" y="675" width="185" height="70" rx="12"/><text x="697" y="705" text-anchor="middle" class="nodeTitle">Prometheus</text><text x="697" y="727" text-anchor="middle" class="nodeSub">metrics and targets</text>
  <rect class="node obs" x="900" y="625" width="170" height="60" rx="12"/><text x="985" y="662" text-anchor="middle" class="nodeTitle">Prometheus</text>
  <rect class="node obs" x="900" y="680" width="170" height="60" rx="12"/><text x="985" y="717" text-anchor="middle" class="nodeTitle">Loki</text>
  <rect class="node obs" x="900" y="735" width="170" height="60" rx="12"/><text x="985" y="772" text-anchor="middle" class="nodeTitle">Tempo</text>
  <text x="72" y="813" class="nodeSub">RabbitMQ, Kafka exporter and Blackbox probes to Prometheus</text><path class="signal" d="M300 805H605V745"/>
  <rect class="node ui" x="1140" y="670" width="205" height="80" rx="12"/><text x="1242" y="702" text-anchor="middle" class="nodeTitle">Grafana</text><text x="1242" y="726" text-anchor="middle" class="nodeSub">dashboards and Explore</text>
  <path class="signal" d="M550 290H565V820H1242V750"/>
  <text x="790" y="842" class="nodeSub">Read only PostgreSQL order data to Grafana</text>
</svg>
